services:
  - type: web
    name: application-assistant-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: FRONTEND_ORIGIN
        value: "https://application-assistant.vercel.app"
      - key: MONGO_DB_NAME
        value: "CuongProAI"
      - key: MONGO_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_TOKEN
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        value: "https://application-assistant-backend.onrender.com/payment/vnpay_return"
